model:
  base: meta-llama
  version: Meta-Llama-3.1-8B
  instruct: Meta-Llama-3.1-8B-Instruct
  max_seq_length: 256
  use_fp16: true
  use_quantization: true

training:
  num_epochs: 3
  batch_size: 4
  learning_rate: 5e-5
  weight_decay: 0.01
  eval_steps: 100
  eval_strategy: steps
  save_steps: 500
  save_strategy: steps
  logging_steps: 50
  logging_strategy: steps

generation:
  temperature: 0.7
  top_k: 50
  top_p: 0.9
  repetition_penalty: 1.2
  no_repeat_ngram_size: 3

logging:
  use_wandb: true
  wandb_project: text_message_fine_tuning
  use_tensorboard: false
  tensorboard_dir: ./logs

data:
  folder: data
  chat_history: krusty_krab.jsonl
  tokenized: tokenized_output.json
  general: output.json